<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8246F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Moj život">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Moj život</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F2EFFF; --surface:#FFFFFF; --surface2:#F6F3FF; --ink:#1D1B3F; --muted:#6A6690;
  --line:#E4DFFA; --line2:#CBC4F0;
  --pink:#E8246F; --blue:#3B5BFF; --violet:#8B3DFF; --orange:#D94A06; --green:#078A62; --yellow:#FFC21F;
  --pink-t:#FFE1EC; --blue-t:#E1E7FF; --violet-t:#EDE0FF; --orange-t:#FFE6D6; --green-t:#D6F4E8; --yellow-t:#FFF1C6;
  --teal:#0E7FA8; --teal-t:#D9F0F8;
  --shadow:0 10px 28px -16px rgba(60,40,170,.35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F0D26; --surface:#1A1740; --surface2:#221E4F; --ink:#F0EEFF; --muted:#A5A1D2;
    --line:#2E2A62; --line2:#4A4590;
    --pink-t:#3C1631; --blue-t:#18224F; --violet-t:#2C1A57; --orange-t:#3D2013; --green-t:#0F3329; --yellow-t:#3A3010; --teal-t:#0F3040;
    --shadow:0 10px 28px -16px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0F0D26; --surface:#1A1740; --surface2:#221E4F; --ink:#F0EEFF; --muted:#A5A1D2;
  --line:#2E2A62; --line2:#4A4590;
  --pink-t:#3C1631; --blue-t:#18224F; --violet-t:#2C1A57; --orange-t:#3D2013; --green-t:#0F3329; --yellow-t:#3A3010; --teal-t:#0F3040;
  --shadow:0 10px 28px -16px rgba(0,0,0,.6);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.45 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
h1,h2,h3,.disp{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;margin:0;letter-spacing:-.02em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
input,select,textarea{background:var(--surface2);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent,var(--blue))}
textarea{resize:vertical;min-height:90px;line-height:1.5}
:focus-visible{outline:3px solid var(--accent,var(--blue));outline-offset:2px}
.muted{color:var(--muted)}
.c-pink{--accent:var(--pink);--accent-t:var(--pink-t)}
.c-blue{--accent:var(--blue);--accent-t:var(--blue-t)}
.c-violet{--accent:var(--violet);--accent-t:var(--violet-t)}
.c-orange{--accent:var(--orange);--accent-t:var(--orange-t)}
.c-green{--accent:var(--green);--accent-t:var(--green-t)}
.c-yellow{--accent:#B98500;--accent-t:var(--yellow-t)}
.c-teal{--accent:var(--teal);--accent-t:var(--teal-t)}

/* shell */
.side{display:none}
.main{padding:16px 16px 100px}
.wrap{max-width:1180px;margin:0 auto}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:2px;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;border-radius:14px;color:var(--muted);font-size:11px;font-weight:600}
.tab.on{background:var(--accent-t);color:var(--accent)}
@media(min-width:900px){
  .tabbar{display:none}
  .side{display:flex;flex-direction:column;gap:6px;position:fixed;left:0;top:0;bottom:0;width:236px;padding:calc(24px + env(safe-area-inset-top,0px)) 14px 20px;background:var(--surface);border-right:1px solid var(--line)}
  .main{margin-left:236px;padding:28px 36px 56px}
}
.brand{font:800 24px "Bricolage Grotesque",Figtree,sans-serif;letter-spacing:-.03em;padding:0 10px 14px}
.brand span{color:var(--pink)}
.snav{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;font-weight:600;color:var(--muted);width:100%}
.snav:hover{background:var(--surface2)}
.snav.on{background:var(--accent-t);color:var(--accent)}
.side-foot{margin-top:auto;padding:12px;border-radius:16px;background:var(--yellow-t)}
.side-foot b{display:block;font:700 15px "Bricolage Grotesque",Figtree,sans-serif}

.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.top h1{font-size:30px;font-weight:800;line-height:1.1}
.top p{margin:4px 0 0;color:var(--muted)}
.top-r{display:flex;align-items:center;gap:8px;flex:none}
.status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.status i{width:8px;height:8px;border-radius:99px;background:var(--line2)}
.status.saved i{background:var(--green)}
.status.saving i{background:var(--yellow)}
.status.error i{background:var(--pink)}
.status.offline i{background:var(--orange)}
.status.syncerr i{background:var(--orange)}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted);background:var(--surface);border:1px solid var(--line)}
.icon-btn.sm{width:30px;height:30px;border-radius:9px;background:none;border:0}
.icon-btn:hover{color:var(--ink);background:var(--surface2)}

/* primitives */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.card + .card{margin-top:14px}
.card h2{font-size:18px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h2 small{font:600 13px Figtree,sans-serif;color:var(--muted);letter-spacing:0}
.grid2{display:grid;gap:14px;align-items:start}
.grid2>div>.card + .card{margin-top:14px}
@media(min-width:900px){.grid2{grid-template-columns:1.15fr 1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:99px;font-weight:700;background:var(--surface2);border:1.5px solid var(--line)}
.btn.primary{background:var(--accent,var(--blue));color:#fff;border-color:transparent}
.btn.ghost{background:none}
.btn.danger{color:var(--pink)}
.btn.sm{padding:7px 14px;font-size:14px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--accent-t);color:var(--accent);font-size:12px;font-weight:700;white-space:nowrap}
.badge.late{background:var(--pink-t);color:var(--pink)}
.badge.today{background:var(--yellow-t);color:#8A6100}
:root[data-theme="dark"] .badge.today{color:var(--yellow)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .badge.today{color:var(--yellow)}}
.bar{height:10px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent,var(--blue));border-radius:99px;transition:width .45s ease}
.bar.tall{height:14px}
.seg{display:flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:99px;margin-bottom:14px;width:fit-content;max-width:100%;overflow-x:auto}
.seg button{padding:8px 16px;border-radius:99px;font-weight:700;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--accent);color:#fff}
.empty{padding:22px 14px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.empty-s{color:var(--muted);padding:14px 0}
.row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row-main{flex:1;min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;cursor:pointer}
.row-main .t{overflow-wrap:anywhere}
.row.done .t{text-decoration:line-through;color:var(--muted)}
.check{flex:none;width:26px;height:26px;border-radius:9px;border:2px solid var(--line2);position:relative;background:var(--surface)}
.check[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.check[aria-pressed="true"]::after{content:"";position:absolute;left:8px;top:3px;width:6px;height:12px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.prio{width:8px;height:8px;border-radius:99px;flex:none}
.prio.p1{background:var(--yellow)}
.prio.p2{background:var(--pink)}
.addrow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.addrow input[type=text]{flex:1 1 160px}
.addrow input[type=date]{flex:0 1 150px}
.sub-h{font:700 13px Figtree,sans-serif;color:var(--muted);margin:16px 0 4px}
.sub-h.late{color:var(--pink)}

/* hero (Danas) */
.hero{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--pink);color:#fff;border-radius:28px;padding:22px 22px 22px 24px;margin-bottom:14px;overflow:hidden}
.hero-day{font:800 clamp(72px,18vw,112px)/.85 "Bricolage Grotesque",Figtree,sans-serif;letter-spacing:-.06em}
.hero-meta{margin-top:10px;font-weight:700;font-size:17px}
.hero-meta span{display:block;font-weight:500;opacity:.85;font-size:14px}
.hero-hi{margin:12px 0 0;max-width:30ch;font-weight:600}
.ring{position:relative;width:128px;height:128px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:11;stroke-linecap:round}
.ring .tr{stroke:rgba(255,255,255,.28)}
.ring .pr{stroke:#fff;transition:stroke-dasharray .6s ease}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 28px "Bricolage Grotesque",Figtree,sans-serif;line-height:1}
.ring-c small{font:600 11px Figtree,sans-serif;opacity:.9;margin-top:4px}
@media(max-width:420px){.ring{width:104px;height:104px}.ring-c{font-size:23px}}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.tile{border-radius:18px;padding:12px 12px 13px;background:var(--accent-t);color:var(--ink);min-width:0}
.tile .k{font-size:12px;font-weight:700;color:var(--accent)}
.tile .v{font:800 26px/1.1 "Bricolage Grotesque",Figtree,sans-serif;margin:3px 0 6px}
.tile .v small{font:600 12px Figtree,sans-serif;color:var(--muted);letter-spacing:0}
.tile .bar{height:7px;background:rgba(0,0,0,.08)}
.tile .s{font-size:12px;color:var(--muted)}
.hchips{display:flex;flex-wrap:wrap;gap:8px}
.hchip{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:99px;background:var(--surface2);border:1.5px solid var(--line);font-weight:600}
.hchip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.hchip small{font-weight:700;opacity:.8}
.moods{display:flex;gap:8px;justify-content:space-between}
.mood{flex:1;padding:10px 0;border-radius:14px;background:var(--surface2);border:1.5px solid var(--line);font-size:26px;text-align:center;line-height:1}
.mood small{display:block;font:600 11px Figtree,sans-serif;color:var(--muted);margin-top:6px}
.mood.on{border-color:var(--accent);background:var(--accent-t)}

/* plan */
.daychips{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.daychips button{flex:1;min-width:46px;padding:9px 0;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-weight:700;text-align:center;position:relative}
.daychips button.on{background:var(--accent);color:#fff;border-color:transparent}
.daychips button.today:not(.on){border-color:var(--accent);color:var(--accent)}
.daychips button i{position:absolute;bottom:4px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:99px;background:currentColor;opacity:.6}
.week{display:grid;gap:12px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px}
.day h3{font-size:16px;margin-bottom:8px}
.day.today h3{color:var(--accent)}
.block{display:block;width:100%;padding:9px 11px;border-radius:12px;background:var(--bt);border-left:4px solid var(--bc);margin-bottom:8px}
.block .tm{display:block;font-size:12px;font-weight:700;color:var(--bc)}
.block .bt{display:block;font-weight:600;overflow-wrap:anywhere}
.b-faks{--bc:var(--violet);--bt:var(--violet-t)}
.b-gym{--bc:var(--orange);--bt:var(--orange-t)}
.b-posao{--bc:var(--blue);--bt:var(--blue-t)}
.b-licno{--bc:var(--green);--bt:var(--green-t)}
.b-odmor{--bc:#B98500;--bt:var(--yellow-t)}
.block.now{box-shadow:0 0 0 2px var(--bc)}
.add-in{width:100%;padding:8px;border-radius:12px;border:1.5px dashed var(--line2);color:var(--muted);font-weight:600;text-align:center}
@media(max-width:1199px){.day:not(.sel){display:none}}
@media(min-width:1200px){.daychips{display:none}.week{grid-template-columns:repeat(7,minmax(0,1fr))}}

/* faks */
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.subjects{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.subj{display:block;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 14px 13px;border-top:6px solid var(--accent);box-shadow:var(--shadow)}
.subj-top{display:flex;justify-content:space-between;gap:8px;margin-bottom:12px}
.subj-top b{font:700 17px "Bricolage Grotesque",Figtree,sans-serif;overflow-wrap:anywhere}
.subj-meta{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font-size:13px;color:var(--muted)}
.timer{display:flex;flex-direction:column;align-items:center;gap:12px}
.timer-t{font:800 64px/1 "Bricolage Grotesque",Figtree,sans-serif;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.timer-r{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pre{padding:7px 14px;border-radius:99px;border:1.5px solid var(--line);font-weight:700;color:var(--muted)}
.pre.on{background:var(--accent-t);border-color:var(--accent);color:var(--accent)}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px}
.bars>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%;font-size:11px;color:var(--muted)}
.bars i{display:block;width:100%;background:var(--accent);border-radius:8px 8px 3px 3px;min-height:4px}
.bars .z i{background:var(--line)}
.bars .td b{color:var(--accent)}
.back{display:inline-flex;align-items:center;gap:4px;margin-bottom:12px;font-weight:700;color:var(--muted)}

/* gym */
.dots{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dots i{width:22px;height:22px;border-radius:99px;border:2.5px solid var(--line2)}
.dots i.on{background:var(--accent);border-color:var(--accent)}
.plans{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.plan-b{display:block;width:100%;padding:16px;border-radius:18px;background:var(--accent);color:#fff;font:700 17px "Bricolage Grotesque",Figtree,sans-serif}
.plan-b small{display:block;font:500 13px Figtree,sans-serif;opacity:.9;margin-top:3px}
.ex-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ex-h b{flex:1;font:700 17px "Bricolage Grotesque",Figtree,sans-serif}
.sets{display:grid;gap:6px;margin-bottom:10px}
.sets-h,.set{display:grid;grid-template-columns:44px 1fr 1fr 34px;gap:8px;align-items:center}
.sets-h{font-size:12px;font-weight:700;color:var(--muted)}
.set .sn{font-weight:800;color:var(--accent);text-align:center}
.set input{text-align:center;padding:9px 6px;font-weight:700}
.chart{width:100%;height:auto;display:block;color:var(--accent)}
.chart text{fill:var(--muted);font:600 10px Figtree,sans-serif}
.kv{display:flex;gap:20px;margin-bottom:6px;flex-wrap:wrap}
.kv b{display:block;font:800 26px "Bricolage Grotesque",Figtree,sans-serif}
.kv span{font-size:12px;color:var(--muted)}
.hist{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.hist:last-child{border-bottom:0}
.hist small{display:block;color:var(--muted)}
.plan-ex{margin:8px 0 12px;padding-left:0;list-style:none}
.plan-ex li{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--line)}
.plan-ex li span{color:var(--muted)}

/* ja */
.dnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.dnav b{font:700 18px "Bricolage Grotesque",Figtree,sans-serif;text-align:center;flex:1}
.fl{display:block;margin-bottom:12px;font-weight:600}
.fl span{display:block;margin-bottom:5px;font-size:13px;color:var(--muted)}
.entry{display:block;width:100%;padding:11px 0;border-bottom:1px solid var(--line)}
.entry:last-child{border-bottom:0}
.entry b{display:flex;gap:8px;align-items:center}
.entry p{margin:3px 0 0;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.goal-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px}
.goal-h b{font:700 18px "Bricolage Grotesque",Figtree,sans-serif;overflow-wrap:anywhere}
.habit-grid{display:grid;grid-template-columns:minmax(90px,1.4fr) repeat(7,minmax(30px,1fr)) 48px;gap:6px;align-items:center}
.habit-grid .hh{font-size:11px;font-weight:700;color:var(--muted);text-align:center}
.habit-grid .hn{font-weight:600;overflow-wrap:anywhere;cursor:pointer}
.hc{width:100%;aspect-ratio:1;max-width:34px;margin:0 auto;border-radius:10px;border:2px solid var(--line2);background:var(--surface)}
.hc.on{background:var(--accent);border-color:var(--accent)}
.hs{font-weight:800;text-align:right;font-size:13px}
.qchips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

/* budzet */
.tile .v.sm{font-size:17px;line-height:1.25;overflow-wrap:anywhere}
.bar.over i{background:var(--pink)}
.amt{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.in{color:var(--green)}
.amt.save{color:var(--blue)}
.tx{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);width:100%}
.tx:last-child{border-bottom:0}
.tx .dot{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--accent-t);color:var(--accent);font-weight:800;flex:none}
.tx-main{flex:1;min-width:0}
.tx-main b{display:block;overflow-wrap:anywhere}
.tx-main small{color:var(--muted)}
.catrow{display:block;width:100%;padding:10px 0;border-bottom:1px solid var(--line)}
.catrow:last-child{border-bottom:0}
.catrow .ch{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}
.catrow .ch b{overflow-wrap:anywhere}
.catrow .ch span{color:var(--muted);font-size:13px;white-space:nowrap}

/* sheet + toast */
.scrim{position:fixed;inset:0;background:rgba(14,10,40,.55);z-index:40}
.sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;max-height:90vh;max-height:90dvh;overflow:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sheet-h h3{font-size:22px;font-weight:800}
.sheet-f{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
.sheet-f .btn.primary{flex:1}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw label{cursor:pointer}
.sw input{position:absolute;opacity:0;width:0;height:0}
.sw i{display:block;width:34px;height:34px;border-radius:99px;border:3px solid transparent;background-clip:padding-box;outline:2px solid transparent}
.sw input:checked + i{outline:3px solid var(--ink);outline-offset:1px}
.sw input:focus-visible + i{outline:3px solid var(--blue)}
.sheet .row2{display:flex;gap:10px}
.sheet .row2>*{flex:1}
@media(min-width:700px){.sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:480px;border-radius:24px;animation:pop .2s ease-out}}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{from{transform:translate(-50%,-47%);opacity:0}to{transform:translate(-50%,-50%);opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:99px;font-weight:700;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);animation:up .2s ease-out;max-width:90vw;text-align:center}
@media(min-width:900px){.toast{bottom:32px}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d);};

const ICONS={
 home:'<path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/>',
 cal:'<rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
 book:'<path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3"/>',
 dumb:'<path d="M6.5 6.5v11M17.5 6.5v11M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/>',
 pen:'<path d="M4 20l1-4L16.5 4.5a2 2 0 0 1 3 3L8 19z"/><path d="M14.5 6.5l3 3"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>',
 wallet:'<path d="M4 8V7a2.5 2.5 0 0 1 2.5-2.5H18"/><rect x="3.5" y="7.5" width="17" height="12" rx="3"/><circle cx="16.5" cy="13.5" r="1.2"/>',
 x:'<path d="M6 6l12 12M18 6L6 18"/>',
 back:'<path d="M15 6l-6 6 6 6"/>',
 fwd:'<path d="M9 6l6 6-6 6"/>',
 play:'<path d="M7 5l12 7-12 7z"/>',
 pause:'<path d="M8 5v14M16 5v14"/>'
};
const ic=(n,s)=>'<svg width="'+(s||22)+'" height="'+(s||22)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICONS[n]+'</svg>';

/* ---------- state ---------- */
const defaultCats=()=>['Hrana','Prevoz','Smeštaj i računi','Izlasci','Faks i knjige','Zdravlje','Ostalo'].map(n=>({id:uid(),name:n,limit:0}));
const blank=()=>({v:1,settings:{name:'',gym:3,theme:'auto',currency:'RSD'},tx:[],budget:{monthly:0,goal:{name:'',target:0},cats:defaultCats()},tasks:[],blocks:[],subjects:[],study:[],plans:[],sessions:[],body:[],habits:[],habitLog:{},journal:{},goals:[],draft:null});
function norm(o){
  const b=blank();o=o||{};
  ['tasks','blocks','subjects','study','plans','sessions','body','habits','goals'].forEach(k=>{b[k]=Array.isArray(o[k])?o[k]:[];});
  b.settings=Object.assign(b.settings,o.settings||{});
  b.habitLog=(o.habitLog&&typeof o.habitLog==='object')?o.habitLog:{};
  b.journal=(o.journal&&typeof o.journal==='object')?o.journal:{};
  b.draft=o.draft||null;
  b.tx=Array.isArray(o.tx)?o.tx:[];
  if(o.budget&&Array.isArray(o.budget.cats))b.budget={monthly:Number(o.budget.monthly)||0,goal:Object.assign({name:'',target:0},o.budget.goal||{}),cats:o.budget.cats};
  b.subjects.forEach(s=>{s.topics=s.topics||[];s.kols=s.kols||[];});
  b.goals.forEach(g=>{g.milestones=g.milestones||[];});
  b.sessions.sort((a,c)=>(a.at||0)-(c.at||0));
  return b;
}
let S=blank();
const ui={sub:{plan:'nedelja',gym:'trening',ja:'dnevnik'},planDay:dow(TODAY()),subject:null,jDate:TODAY(),exSel:'',bMonth:TODAY().slice(0,7)};
let view='danas';

/* ---------- persistence ---------- */
const LS_KEY='moj-zivot-v1';
let db=null,uidStr=null,known=new Set(),lastWritten={};
let saveTimer=null,saving=false,pending=false,dirty=false,saveState='local';
const lsSave=()=>{try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){}};
const lsLoad=()=>{try{const t=localStorage.getItem(LS_KEY);return t?JSON.parse(t):null;}catch(e){return null;}};
const ref=id=>db.doc('data/users/'+uidStr+'/'+id);

function toDocs(){
  const docs={core:clean({settings:S.settings,tasks:S.tasks,blocks:S.blocks,subjects:S.subjects,plans:S.plans,habits:S.habits,goals:S.goals,body:S.body,draft:S.draft,budget:S.budget})};
  const mon={};
  const m=d=>{const k=d.slice(0,7);return mon[k]||(mon[k]={journal:{},habitLog:{},sessions:[],study:[],tx:[]});};
  for(const d in S.journal){const j=S.journal[d];if(j&&(j.mood||(j.text||'').trim()||(j.good||'').trim()))m(d).journal[d]=j;}
  for(const d in S.habitLog){if(S.habitLog[d]&&S.habitLog[d].length)m(d).habitLog[d]=S.habitLog[d];}
  S.sessions.forEach(x=>m(x.date).sessions.push(x));
  S.study.forEach(x=>m(x.date).study.push(x));
  S.tx.forEach(x=>m(x.date).tx.push(x));
  for(const k in mon)docs['log-'+k]=clean(mon[k]);
  return docs;
}
function fromDocs(map){
  const c=map.core||{};
  const o={settings:c.settings,tasks:c.tasks,blocks:c.blocks,subjects:c.subjects,plans:c.plans,habits:c.habits,goals:c.goals,body:c.body,draft:c.draft,budget:c.budget,
    journal:{},habitLog:{},sessions:[],study:[],tx:[]};
  for(const id in map){
    if(id.indexOf('log-')!==0)continue;
    const l=map[id];
    Object.assign(o.journal,l.journal||{});
    Object.assign(o.habitLog,l.habitLog||{});
    (l.sessions||[]).forEach(x=>o.sessions.push(x));
    (l.study||[]).forEach(x=>o.study.push(x));
    (l.tx||[]).forEach(x=>o.tx.push(x));
  }
  return norm(o);
}
async function flush(){
  if(FB.on)return fbFlush();
  if(!db){saveState='local';renderStatus();return;}
  if(saving){pending=true;return;}
  saving=true;saveState='saving';renderStatus();
  try{
    do{
      pending=false;
      const docs=toDocs();
      for(const id in docs){
        const j=JSON.stringify(docs[id]);
        if(lastWritten[id]===j)continue;
        await ref(id).set(docs[id]);
        lastWritten[id]=j;known.add(id);
      }
      for(const id of Array.from(known)){
        if(!docs[id]){await ref(id).delete();known.delete(id);delete lastWritten[id];}
      }
    }while(pending);
    saveState='saved';
  }catch(e){saveState='error';console.error(e);}
  saving=false;renderStatus();
}
function queueSave(){
  dirty=true;lsSave();
  clearTimeout(saveTimer);
  saveTimer=setTimeout(flush,600);
  if(db||(FB.on&&fbSynced)){saveState=(FB.on&&!navigator.onLine)?'offline':'saving';renderStatus();}
}
function renderStatus(){
  const el=$('#status');if(!el)return;
  const t=(saveState==='saved'&&FB.on&&FB.user)?'Sinhronizovano':{saved:'Sačuvano',saving:'Čuvam…',local:'Samo na ovom uređaju',error:'Greška pri čuvanju',offline:'Nema interneta',signedout:'Nisi prijavljen',connecting:'Povezujem se…',syncerr:'Sinhronizacija nije dostupna'}[saveState];
  el.className='status '+saveState;
  el.innerHTML='<i></i>'+t;
}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&saveTimer){clearTimeout(saveTimer);saveTimer=null;flush();}});
function hasContent(){return S.tasks.length||S.blocks.length||S.subjects.length||S.plans.length||S.sessions.length||S.habits.length||S.goals.length||S.body.length||S.tx.length||Object.keys(S.journal).length;}

/* ---------- Firebase sync ---------- */
const FBC=window.FIREBASE_CONFIG||null;
const FBV='10.14.1';
const SYNC_KEY='moj-zivot-sync-v1';
const FB={on:!!(FBC&&FBC.apiKey&&FBC.projectId),adapter:null,user:null,uid:null,unsub:null,err:null,loading:false,applyVer:0,pushSeq:0,latest:null,latestSeq:0,defT:null,retryT:null};
let syncBase={},fbSeen={},fbSynced=false,fbSaving=false,fbPending=false;
const FB_TO=window.__FB_TIMEOUT__||12000;
const withTO=p=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(Object.assign(new Error('timeout'),{code:'timeout'})),FB_TO))]);

const canon=v=>Array.isArray(v)?'['+v.map(canon).join(',')+']':(v&&typeof v==='object')?'{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+canon(v[k])).join(',')+'}':JSON.stringify(v);
function hh(d){
  const s=canon(d);let h1=0xdeadbeef,h2=0x41c6ce57;
  for(let i=0;i<s.length;i++){const ch=s.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(36);
}
function mergeVal(a,b){
  if(Array.isArray(a)&&Array.isArray(b)){
    const objs=a.concat(b).some(x=>x&&typeof x==='object');
    if(!objs)return Array.from(new Set(a.concat(b)));
    const seen=new Set(),out=[];
    a.concat(b).forEach(x=>{if(x&&x.id!==undefined){if(seen.has(x.id))return;seen.add(x.id);}out.push(x);});
    return out;
  }
  if(a&&b&&typeof a==='object'&&typeof b==='object'&&!Array.isArray(a)&&!Array.isArray(b)){
    const o={};
    new Set(Object.keys(a).concat(Object.keys(b))).forEach(k=>{o[k]=(k in a&&k in b)?mergeVal(a[k],b[k]):(k in a?a[k]:b[k]);});
    return o;
  }
  return a!==undefined?a:b;
}
function mergeDoc(id,a,b){
  const m=mergeVal(a,b);
  if(id==='core')m.draft=a.draft||b.draft||null;
  return clean(m);
}
function remapCats(L,cloud){
  const lc=L.core&&L.core.budget&&L.core.budget.cats,cc=cloud.core&&cloud.core.budget&&cloud.core.budget.cats;
  if(!lc||!cc)return;
  const byName={};cc.forEach(c=>{byName[(c.name||'').toLowerCase()]=c.id;});
  const map={};
  L.core.budget.cats=lc.filter(c=>{const k=(c.name||'').toLowerCase();if(byName[k]!==undefined&&byName[k]!==c.id){map[c.id]=byName[k];return false;}return true;});
  Object.keys(L).forEach(id=>{if(id.indexOf('log-')===0&&L[id].tx)L[id].tx.forEach(x=>{if(map[x.cat])x.cat=map[x.cat];});});
}
function saveSync(){try{localStorage.setItem(SYNC_KEY,JSON.stringify({uid:FB.uid,base:syncBase}));}catch(e){}}
function uiBusy(){
  if(typeof sheet!=='undefined'&&sheet)return true;
  const a=document.activeElement;
  return !!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName));
}

async function makeAdapter(){
  const b='https://www.gstatic.com/firebasejs/'+FBV+'/';
  const r=await Promise.all([import(b+'firebase-app.js'),import(b+'firebase-auth.js'),import(b+'firebase-firestore.js')]);
  const M=r[0],AU=r[1],FS=r[2];
  const app=M.initializeApp(FBC),auth=AU.getAuth(app),fdb=FS.getFirestore(app);
  const prov=new AU.GoogleAuthProvider();prov.setCustomParameters({prompt:'select_account'});
  const col=uid=>FS.collection(fdb,'users',uid,'docs');
  return {
    onAuth:cb=>AU.onAuthStateChanged(auth,u=>cb(u?{uid:u.uid,email:u.email||''}:null)),
    signIn:()=>AU.signInWithPopup(auth,prov).catch(e=>{
      if(e&&(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment'))return AU.signInWithRedirect(auth,prov);
      throw e;}),
    signOut:()=>AU.signOut(auth),
    listen:(uid,cb,eb)=>FS.onSnapshot(col(uid),{includeMetadataChanges:true},snap=>{const m={};snap.forEach(d=>{m[d.id]=d.data();});cb(m,snap.metadata.fromCache);},eb),
    set:(uid,id,data,expected)=>FS.runTransaction(fdb,async tx=>{
      const r=FS.doc(fdb,'users',uid,'docs',id),snap=await tx.get(r);
      const cur=snap.exists()?snap.data():undefined;
      if((cur===undefined?undefined:hh(cur))!==expected)throw Object.assign(new Error('conflict'),{code:'conflict'});
      tx.set(r,data);
    }),
    del:(uid,id,expected)=>FS.runTransaction(fdb,async tx=>{
      const r=FS.doc(fdb,'users',uid,'docs',id),snap=await tx.get(r);
      if(snap.exists()&&hh(snap.data())!==expected)throw Object.assign(new Error('conflict'),{code:'conflict'});
      tx.delete(r);
    })
  };
}

async function fbBoot(){
  if(FB.loading||FB.adapter)return;
  FB.loading=true;saveState='connecting';renderStatus();
  try{
    FB.adapter=window.__FB_ADAPTER__||await makeAdapter();
    FB.adapter.onAuth(onAuthUser);
  }catch(e){
    FB.err=e;FB.adapter=null;
    saveState=navigator.onLine?'syncerr':'offline';renderStatus();
    if(navigator.onLine)toast('Sinhronizacija trenutno nije dostupna');
  }
  FB.loading=false;
}
function stopListen(){
  if(FB.unsub){try{FB.unsub();}catch(e){}FB.unsub=null;}
  fbSynced=false;clearTimeout(FB.defT);clearTimeout(FB.retryT);FB.latest=null;
}
function onAuthUser(u){
  if(u&&FB.user&&FB.user.uid===u.uid)return;
  stopListen();
  FB.user=u;
  if(!u){saveState='signedout';render();return;}
  FB.uid=u.uid;
  let rec=null;try{rec=JSON.parse(localStorage.getItem(SYNC_KEY)||'null');}catch(e){}
  if(rec&&rec.uid&&rec.uid!==u.uid){
    try{localStorage.setItem('moj-zivot-backup-'+Date.now(),JSON.stringify(S));}catch(e){}
    S=blank();lsSave();syncBase={};FB.applyVer++;
    toast('Ovaj uređaj je bio vezan za drugi nalog. Njegovi podaci su ostali samo lokalno.');
  }else syncBase=(rec&&rec.base)||{};
  saveSync();
  saveState='saving';render();
  FB.unsub=FB.adapter.listen(u.uid,onCloud,onCloudErr);
}
function onCloudErr(e){
  FB.err=e;saveState=(e&&e.code==='unavailable')||!navigator.onLine?'offline':'error';renderStatus();
  if(e&&e.code==='permission-denied')toast('Baza odbija pristup. Proveri pravila (Rules) u Firebase-u.');
}
function onCloud(map,fromCache){
  if(fromCache)return;
  FB.latest=map;FB.latestSeq=FB.pushSeq;
  if(uiBusy()){scheduleDeferred();return;}
  FB.latest=null;
  applyCloud(map);
}
function scheduleDeferred(){
  clearTimeout(FB.defT);
  FB.defT=setTimeout(()=>{
    if(!FB.latest)return;
    if(uiBusy()){scheduleDeferred();return;}
    const m=FB.latest,seq=FB.latestSeq;FB.latest=null;
    if(seq!==FB.pushSeq)return;
    applyCloud(m);
  },1200);
}
function applyCloud(cloud){
  const L=toDocs(),hc={},hl={};
  Object.keys(cloud).forEach(id=>{hc[id]=hh(cloud[id]);});
  Object.keys(L).forEach(id=>{hl[id]=hh(L[id]);});
  fbSeen=Object.assign({},hc);
  const first=!Object.keys(syncBase).length;
  const ids=Array.from(new Set(Object.keys(cloud).concat(Object.keys(L),Object.keys(syncBase))));
  let out=Object.assign({},L),changed=false;
  if(first){
    if(Object.keys(cloud).length){
      if(!hasContent()){out=Object.assign({},cloud);changed=true;}
      else{
        remapCats(L,cloud);
        ids.forEach(id=>{if(cloud[id]&&L[id])out[id]=mergeDoc(id,L[id],cloud[id]);else if(cloud[id])out[id]=cloud[id];});
        changed=true;
      }
    }
  }else{
    for(const id of ids){
      const l=hl[id],c=hc[id],b=syncBase[id];
      if(l===c)continue;
      if(b!==undefined&&l===b){if(c===undefined)delete out[id];else out[id]=cloud[id];changed=true;}
      else if(b!==undefined&&c===b){/* lokalna izmena, ide u oblak */}
      else if(b===undefined&&l===undefined){out[id]=cloud[id];changed=true;}
      else if(b===undefined&&c===undefined){/* novo lokalno, ide u oblak */}
      else if(c===undefined){/* obrisano u oblaku, a lokalno izmenjeno: zadrži lokalno */}
      else if(l===undefined){out[id]=cloud[id];changed=true;}
      else{out[id]=mergeDoc(id,L[id],cloud[id]);changed=true;}
    }
  }
  if(changed){S=fromDocs(out);FB.applyVer++;lsSave();applyTheme();}
  const L2=toDocs();
  ids.forEach(id=>{
    const h=L2[id]?hh(L2[id]):undefined;
    if(h!==undefined&&h===hc[id])syncBase[id]=h;
    else if(h===undefined&&hc[id]===undefined)delete syncBase[id];
  });
  saveSync();
  const needPush=ids.some(id=>(L2[id]?hh(L2[id]):undefined)!==hc[id]);
  const wasSynced=fbSynced;
  fbSynced=true;
  if(needPush)fbFlush();
  else{saveState='saved';FB.err=null;}
  if(changed){render();if(!wasSynced)toast('Podaci su sinhronizovani');}else renderStatus();
}
async function fbFlush(){
  if(!FB.user||!fbSynced)return;
  if(fbSaving){fbPending=true;return;}
  if(!navigator.onLine){saveState='offline';renderStatus();return;}
  fbSaving=true;saveState='saving';renderStatus();
  const uid=FB.user.uid;
  try{
    do{
      fbPending=false;
      const ver=FB.applyVer,docs=toDocs();
      for(const id of Object.keys(docs)){
        if(FB.applyVer!==ver){fbPending=true;break;}
        const hv=hh(docs[id]);
        if(syncBase[id]===hv)continue;
        await withTO(FB.adapter.set(uid,id,docs[id],fbSeen[id],hh));
        syncBase[id]=hv;fbSeen[id]=hv;FB.pushSeq++;
      }
      if(!fbPending){
        for(const id of Object.keys(syncBase)){
          if(FB.applyVer!==ver){fbPending=true;break;}
          if(!docs[id]){
            await withTO(FB.adapter.del(uid,id,fbSeen[id],hh));
            delete syncBase[id];delete fbSeen[id];FB.pushSeq++;
          }
        }
      }
      saveSync();
    }while(fbPending);
    saveState='saved';FB.err=null;
  }catch(e){
    if(e&&e.code==='conflict'){
      clearTimeout(FB.retryT);FB.retryT=setTimeout(fbFlush,1500);
      fbSaving=false;saveState='saving';renderStatus();return;
    }
    FB.err=e;
    const off=!navigator.onLine||e.code==='timeout'||e.code==='unavailable';
    saveState=off?'offline':'error';
    clearTimeout(FB.retryT);FB.retryT=setTimeout(fbFlush,off?15000:60000);
    if(e&&e.code==='permission-denied')toast('Baza odbija pristup. Proveri pravila (Rules) u Firebase-u.');
    console.error(e);
  }
  fbSaving=false;renderStatus();
}

/* ---------- derived stats ---------- */
function stats(){
  const t=TODAY();
  const hset=new Set(S.habits.map(h=>h.id));
  const tasksDone=S.tasks.filter(x=>x.done).length;
  let habitChecks=0;
  for(const d in S.habitLog)habitChecks+=S.habitLog[d].filter(id=>hset.has(id)).length;
  const studyMin=S.study.reduce((a,b)=>a+b.min,0);
  const jDays=Object.keys(S.journal).filter(d=>{const j=S.journal[d];return (j.text||'').trim()||(j.good||'').trim();});
  const ms=S.goals.reduce((a,g)=>a+g.milestones.filter(m=>m.done).length,0);
  const topics=S.subjects.reduce((a,s)=>a+s.topics.filter(x=>x.done).length,0);
  const kolsP=S.subjects.reduce((a,s)=>a+(s.kols||[]).filter(k=>k.status==='passed').length,0);
  const xp=tasksDone*10+habitChecks*5+S.sessions.length*50+Math.floor(studyMin/5)*2+jDays.length*15+ms*25+topics*20+kolsP*30+S.tx.length*2;
  const per=200,level=Math.floor(xp/per)+1,into=xp%per;
  const titles=[[15,'Legenda'],[10,'Mašina'],[6,'Na dobrom putu'],[3,'U ritmu'],[1,'Početnik']];
  const title=(titles.find(x=>level>=x[0])||titles[4])[1];
  const act=new Set();
  S.tasks.forEach(x=>{if(x.done&&x.doneAt)act.add(x.doneAt);});
  for(const d in S.habitLog){if(S.habitLog[d].some(id=>hset.has(id)))act.add(d);}
  S.sessions.forEach(x=>act.add(x.date));
  S.study.forEach(x=>act.add(x.date));
  S.tx.forEach(x=>act.add(x.date));
  jDays.forEach(d=>act.add(d));
  let streak=0,d=act.has(t)?t:addDays(t,-1);
  while(act.has(d)){streak++;d=addDays(d,-1);}
  const ws=weekStart(t);
  const wk=S.sessions.filter(x=>x.date>=ws&&x.date<=addDays(ws,6)).length;
  return {xp,level,into,per,title,streak,wk,studyMin};
}
function habitStreak(id){
  const t=TODAY();let d=(S.habitLog[t]||[]).includes(id)?t:addDays(t,-1),n=0;
  while((S.habitLog[d]||[]).includes(id)){n++;d=addDays(d,-1);}
  return n;
}
function todayList(){const t=TODAY();return S.tasks.filter(x=>(!x.done&&x.due&&x.due<=t)||(x.done&&x.doneAt===t));}
function lastSets(name){
  for(let i=S.sessions.length-1;i>=0;i--){
    const e=S.sessions[i].entries.find(x=>x.name.toLowerCase()===name.toLowerCase());
    if(e)return e.sets;
  }
  return null;
}
function studyWeek(){
  const ws=weekStart(TODAY());const out=[];
  for(let i=0;i<7;i++){const d=addDays(ws,i);out.push({d,min:S.study.filter(x=>x.date===d).reduce((a,b)=>a+b.min,0)});}
  return out;
}

function lineChart(pts,unit){
  if(!pts.length)return '<div class="empty-s">Još nema podataka.</div>';
  const W=320,H=140,L=34,R=12,T=14,B=24;
  const ys=pts.map(p=>p.y);let mn=Math.min.apply(null,ys),mx=Math.max.apply(null,ys);
  const rawMn=mn,rawMx=mx;
  if(mn===mx){mn-=1;mx+=1;}
  const pd=(mx-mn)*.18;mn-=pd;mx+=pd;
  const X=i=>L+(pts.length===1?(W-L-R)/2:i*(W-L-R)/(pts.length-1));
  const Y=v=>T+(H-T-B)*(1-(v-mn)/(mx-mn));
  const line=pts.map((p,i)=>X(i).toFixed(1)+','+Y(p.y).toFixed(1)).join(' ');
  const dots=pts.map((p,i)=>'<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="3.6" fill="currentColor"/>').join('');
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Grafikon">'+
    '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(rawMx).toFixed(1)+'" y2="'+Y(rawMx).toFixed(1)+'" stroke="currentColor" stroke-opacity=".15" stroke-dasharray="3 4"/>'+
    '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(rawMn).toFixed(1)+'" y2="'+Y(rawMn).toFixed(1)+'" stroke="currentColor" stroke-opacity=".15" stroke-dasharray="3 4"/>'+
    (pts.length>1?'<polyline points="'+line+'" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>':'')+dots+
    '<text x="'+(L-6)+'" y="'+(Y(rawMx)+3).toFixed(1)+'" text-anchor="end">'+fmtN(rawMx)+'</text>'+
    (rawMx!==rawMn?'<text x="'+(L-6)+'" y="'+(Y(rawMn)+3).toFixed(1)+'" text-anchor="end">'+fmtN(rawMn)+'</text>':'')+
    '<text x="'+L+'" y="'+(H-6)+'" text-anchor="start">'+fmtShort(pts[0].x)+'</text>'+
    (pts.length>1?'<text x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end">'+fmtShort(pts[pts.length-1].x)+'</text>':'')+
    '</svg>';
}

  o+='<div style="display:flex;justify-content:space-between;align-items:center;margin:20px 0 12px"><h2 class="disp" style="font-size:22px">Predmeti</h2><button class="btn primary c-violet sm" data-a="addSubject">+ Predmet</button></div>';

  else o+='<div class="subjects">'+S.subjects.map(s=>{
    const n=s.topics.length,dn=s.topics.filter(x=>x.done).length,p=n?Math.round(dn/n*100):0;

    if(s.grade)ex='Ocena '+s.grade;

  }).join('')+'</div>';
  return o;
};
function hasPts(k){return k.pts!==''&&k.pts!=null;}
function kolLine(s,t){

  return '<div class="subj-meta"><span>Kolokvijumi: '+dn+'/'+ks.length+' položeno</span><span>'+(nx?'sledeći '+fmtShort(nx.date):'')+'</span></div>';
}
function kolRow(k){
  const t=TODAY();
  let when='bez datuma';
  if(k.date){const d=diffDays(k.date,t);when=fmtShort(k.date)+(k.status==='pending'?(d>0?' · za '+d+' d':d===0?' · danas':' · prošao'):'');}

function kolCard(s){

      '<div class="empty-s">Dodaj kolokvijume sa datumima, pa upiši da li si ih položio i sa koliko bodova.</div>')+'</div>';
}

/* study timer */
const T={sid:'',total:25,state:'idle',endsAt:0,left:0};
let tickId=null;
const timerRem=()=>T.state==='run'?Math.max(0,T.endsAt-Date.now()):T.state==='pause'?T.left:T.total*60000;
const clock=ms=>{const s=Math.ceil(ms/1000);return pad(Math.floor(s/60))+':'+pad(s%60);};
function timerCard(){
  if(!S.subjects.length)return '<div class="card c-violet"><h2>Fokus</h2><p class="muted" style="margin:0">Dodaj predmet pa pokreni tajmer za učenje.</p></div>';
  if(!S.subjects.find(s=>s.id===T.sid))T.sid=S.subjects[0].id;
  const idle=T.state==='idle';
  return '<div class="card c-violet"><h2>Fokus</h2><div class="timer"><select data-ch="timerSubj" aria-label="Predmet"'+(idle?'':' disabled')+'>'+S.subjects.map(s=>'<option value="'+s.id+'"'+(s.id===T.sid?' selected':'')+'>'+esc(s.name)+'</option>').join('')+'</select>'+
    '<div class="timer-t" id="tt" aria-live="off">'+clock(timerRem())+'</div>'+
    '<div class="timer-r">'+[25,45,60].map(m=>'<button class="pre '+(T.total===m?'on':'')+'" data-a="tPreset" data-v="'+m+'"'+(idle?'':' disabled')+'>'+m+' min</button>').join('')+'</div>'+
    '<div class="timer-r">'+(T.state==='run'?'<button class="btn primary" data-a="tPause">'+ic('pause',18)+' Pauza</button>':'<button class="btn primary" data-a="tStart">'+ic('play',18)+' '+(T.state==='pause'?'Nastavi':'Pokreni')+'</button>')+(idle?'':'<button class="btn" data-a="tStop">Završi i sačuvaj</button>')+'</div></div></div>';
}
function tick(){
  if(T.state!=='run')return;
  const rem=T.endsAt-Date.now();
  if(rem<=0){completeTimer();return;}
  const el=$('#tt');if(el)el.textContent=clock(rem);
}
function logStudy(sid,min){S.study.push({id:uid(),sid:sid,date:TODAY(),min:min,at:Date.now()});}
function completeTimer(){
  const L0=stats().level;
  logStudy(T.sid,T.total);
  const m=T.total;T.state='idle';clearInterval(tickId);tickId=null;
  if(navigator.vibrate)try{navigator.vibrate([200,100,200]);}catch(e){}
  commit();xpToast(L0,'Sesija završena: '+m+' min · +'+Math.floor(m/5)*2+' XP');
}

const monthAdd=(k,n)=>{const a=k.split('-').map(Number);const d=new Date(a[0],a[1]-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1);};
const monthLabel=k=>{const a=k.split('-').map(Number);const m=MONTHS[a[1]-1];return m.charAt(0).toUpperCase()+m.slice(1)+' '+a[0];};
const money=n=>{const r=Math.round(n);return (r<0?'−':'')+String(Math.abs(r)).replace(/\B(?=(\d{3})+(?!\d))/g,'.')+' '+(S.settings.currency||'RSD');};
const shortMoney=v=>v>=1000?(v/1000).toFixed(v>=10000?0:1).replace('.',',')+'k':String(Math.round(v));
const catName=id=>{const c=S.budget.cats.find(x=>x.id===id);return c?c.name:'Bez kategorije';};
function monthStats(k){
  const tx=S.tx.filter(x=>x.date.slice(0,7)===k);
  const sum=t=>tx.filter(x=>x.type===t).reduce((a,b)=>a+b.amount,0);
  const byCat={};
  tx.filter(x=>x.type==='out').forEach(x=>{byCat[x.cat||'']=(byCat[x.cat||'']||0)+x.amount;});
  const limit=S.budget.monthly>0?S.budget.monthly:S.budget.cats.reduce((a,c)=>a+(Number(c.limit)||0),0);
  const inc=sum('in'),out=sum('out'),sav=sum('save');
  return {tx:tx,inc:inc,out:out,sav:sav,bal:inc-out-sav,byCat:byCat,limit:limit};
}
function daysLeft(){const t=TODAY();const dim=new Date(Number(t.slice(0,4)),Number(t.slice(5,7)),0).getDate();return dim-Number(t.slice(8,10))+1;}
function budgetCard(){

  const line=ms.limit>0?(rem>=0?'Ostalo '+money(rem)+' · oko '+money(rem/daysLeft())+' dnevno':'Prekoračeno za '+money(-rem)):'Potrošeno ovog meseca: '+money(ms.out);
  return '<div class="card c-teal"><h2>Budžet <small>danas '+money(today)+'</small></h2><p style="margin:0 0 12px">'+line+'</p>'+
    (ms.limit>0?bar(ms.out/ms.limit*100).replace('class="bar"','class="bar'+(rem<0?' over':'')+'"'):'')+
    '<div style="margin-top:12px"><button class="btn primary sm" data-a="addTx" data-t="out">+ Rashod</button></div></div>';
}

  }else L+='<p class="muted" style="margin:0">Postavi koliko mesečno možeš da potrošiš i dobijaš koliko sme dnevno do kraja meseca.</p>';
  L+='</div>';
  const rows=S.budget.cats.map(c=>({c:c,sp:ms.byCat[c.id]||0}));
  const unc=ms.byCat['']||0;
  const catRow=(name,sp,lim,id)=>{

  };
  L+='<div class="card"><h2>Kategorije <button class="btn ghost sm" data-a="addCat">+ Dodaj</button></h2>'+
    (rows.length?rows.map(r=>catRow(r.c.name,r.sp,Number(r.c.limit)||0,r.c.id)).join(''):'<div class="empty-s">Dodaj kategorije troškova.</div>')+(unc>0?catRow('Bez kategorije',unc,0,''):'')+'</div>';
  const saved=S.tx.filter(x=>x.type==='save').reduce((a,b)=>a+b.amount,0),g=S.budget.goal;
  L+='<div class="card"><h2>Štednja <button class="btn ghost sm" data-a="editSavings">'+(g.target>0?'Izmeni cilj':'Postavi cilj')+'</button></h2>'+
    (g.target>0?'<div class="kv"><div><b>'+money(saved)+'</b><span>'+(g.name?esc(g.name):'ušteđeno')+'</span></div><div><b>'+Math.min(100,Math.round(saved/g.target*100))+'%</b><span>od '+money(g.target)+'</span></div></div>'+bar(saved/g.target*100):
      '<div class="kv"><div><b>'+money(saved)+'</b><span>ukupno ušteđeno</span></div></div><p class="muted" style="margin:6px 0 0">Postavi cilj (npr. putovanje) da vidiš napredak.</p>')+
    '<div style="margin-top:12px"><button class="btn sm" data-a="addTx" data-t="save">+ Uplati</button></div></div>';
  /* right column */
  const list=ms.tx.slice().sort((a,b)=>b.date.localeCompare(a.date)||(b.at||0)-(a.at||0));
  let R='<div class="card"><h2>Transakcije <small>'+list.length+'</small></h2>'+(list.length?list.map(x=>{
    const sign=x.type==='out'?'−':x.type==='in'?'+':'';
    const dot=x.type==='out'?catName(x.cat).charAt(0).toUpperCase():x.type==='in'?'+':'★';
    const sub=fmtShort(x.date)+(x.type==='out'?' · '+esc(catName(x.cat)):x.type==='in'?' · prihod':' · štednja');
    return '<button class="tx" data-a="editTx" data-id="'+x.id+'"><span class="dot">'+esc(dot)+'</span><div class="tx-main"><b>'+esc(x.note||(x.type==='out'?catName(x.cat):x.type==='in'?'Prihod':'Uplata u štednju'))+'</b><small>'+sub+'</small></div><span class="amt '+x.type+'">'+sign+money(x.amount)+'</span></button>';
  }).join(''):'<div class="empty"><b>Nema unosa za ovaj mesec</b>Dodaj prvi rashod ili prihod.</div>')+'</div>';
  const mon=[];for(let i=5;i>=0;i--)mon.push(monthAdd(t.slice(0,7),-i));
  const vals=mon.map(m=>({m:m,v:monthStats(m).out}));
  const mx=Math.max(1,...vals.map(x=>x.v));
  R+='<div class="card"><h2>Potrošnja po mesecima</h2><div class="bars">'+vals.map(x=>'<div class="'+(x.v?'':'z ')+(x.m===k?'td':'')+'"><span>'+(x.v?shortMoney(x.v):'')+'</span><i style="height:'+Math.round(x.v/mx*74)+'px"></i><b style="font-weight:700">'+MONTHS[Number(x.m.slice(5,7))-1].slice(0,3)+'</b></div>').join('')+'</div></div>';
  return o+'<div class="grid2"><div>'+L+'</div><div>'+R+'</div></div>';
};

function jaGoals(){

function jaHabits(){
  const t=TODAY(),days=[];for(let i=6;i>=0;i--)days.push(addDays(t,-i));
  let o='<div class="card"><h2>Navike <small>poslednjih 7 dana</small></h2>';
  if(S.habits.length){
    o+='<div class="habit-grid"><span></span>'+days.map(d=>'<span class="hh">'+DAYS3[dow(d)]+'</span>').join('')+'<span></span>'+
      S.habits.map(h=>'<span class="hn" data-a="editHabit" data-id="'+h.id+'">'+esc(h.name)+'</span>'+days.map(d=>{const on=(S.habitLog[d]||[]).includes(h.id);return '<button class="hc '+(on?'on':'')+'" aria-pressed="'+on+'" aria-label="'+esc(h.name)+', '+fmtLong(d)+'" data-a="toggleHabit" data-id="'+h.id+'" data-d="'+d+'"></button>';}).join('')+'<span class="hs">'+habitStreak(h.id)+'🔥</span>').join('')+'</div>';

/* ---------- render ---------- */
function render(){
  const y=window.scrollY;
  const nav=NAV.map(n=>'<button class="snav c-'+n[3]+(view===n[0]?' on':'')+'" data-a="go" data-v="'+n[0]+'"'+(view===n[0]?' aria-current="page"':'')+'>'+ic(n[2])+n[1]+'</button>').join('');
  const st=stats();
  $('#side').innerHTML='<div class="brand">moj<span>.</span>život</div>'+nav+'<div class="side-foot c-yellow"><b>Nivo '+st.level+' · '+esc(st.title)+'</b>'+bar(st.into/st.per*100)+'<span class="muted" style="font-size:12px">'+st.into+' / '+st.per+' XP</span></div>';
  $('#tabbar').innerHTML=NAV.map(n=>'<button class="tab c-'+n[3]+(view===n[0]?' on':'')+'" data-a="go" data-v="'+n[0]+'"'+(view===n[0]?' aria-current="page"':'')+'>'+ic(n[2])+n[1]+'</button>').join('');
  $('#view').innerHTML=VIEWS[view]();
  $('#view').className='wrap c-'+NAV.find(n=>n[0]===view)[3];
  window.scrollTo(0,y);
  renderStatus();
}

/* gym */
function syncDraft(){
  if(!S.draft)return;
  $$('[data-set]').forEach(inp=>{const p=inp.dataset.set.split(':');const e=S.draft.entries[+p[0]];const s=e&&e.sets[+p[1]];if(s)s[p[2]]=inp.value;});
}
A.startPlan=el=>{
  const p=S.plans.find(x=>x.id===el.dataset.id);if(!p)return;
  S.draft={planName:p.name,startedAt:Date.now(),entries:p.exercises.map(ex=>{
    const ls=lastSets(ex.name),sets=[];
    for(let i=0;i<ex.sets;i++){const l=ls&&ls[Math.min(i,ls.length-1)];sets.push({kg:l&&l.kg?String(l.kg):'',reps:l&&l.reps?String(l.reps):''});}
    return {name:ex.name,target:ex.sets+'×'+ex.reps,sets:sets};})};
  commit();
};

A.addSet=el=>{syncDraft();const e=S.draft.entries[+el.dataset.e];const l=e.sets[e.sets.length-1];e.sets.push({kg:l?l.kg:'',reps:l?l.reps:''});commit();};

function parseEx(txt){
  return txt.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
    const m=l.match(/^(.*?)\s+(\d+)\s*[x×*]\s*(\d+(?:-\d+)?)\s*$/i);
    return m?{id:uid(),name:m[1].trim(),sets:Math.min(10,+m[2]),reps:m[3]}:{id:uid(),name:l,sets:3,reps:'10'};
  });
}

    {name:'ex',label:'Vežbe (jedna po liniji, serije x ponavljanja)',type:'textarea',rows:7,value:p?p.exercises.map(e=>e.name+' '+e.sets+'x'+e.reps).join('\n'):'',placeholder:'Bench press 4x8\nPrisetivanje 3x12'}],

function txSheet(type,tx){
  const isNew=!tx;
  const base=isNew?{amount:'',cat:'',date:(ui.bMonth===TODAY().slice(0,7)?TODAY():ui.bMonth+'-01'),note:''}:tx;
  const titles={out:'Rashod',in:'Prihod',save:'Uplata u štednju'};
  const fields=[{name:'amount',label:'Iznos ('+(S.settings.currency||'RSD')+')',value:base.amount,inputmode:'decimal'}];
  if(type==='out')fields.push({name:'cat',label:'Kategorija',type:'select',value:base.cat,options:S.budget.cats.map(c=>[c.id,c.name]).concat([['','Bez kategorije']])});
  fields.push({name:'date',label:'Datum',type:'date',value:base.date});
  fields.push({name:'note',label:'Napomena (nije obavezno)',value:base.note,placeholder:type==='in'?'npr. Stipendija':type==='out'?'npr. Ručak':''});
  openSheet({title:(isNew?'Novi: ':'')+titles[type].toLowerCase(),color:'teal',fields:fields,
    onSave:v=>{
      const a=Math.round(num(v.amount)*100)/100;
      if(!(a>0)||a>1e9){toast('Upiši iznos');return false;}
      if(!v.date){toast('Izaberi datum');return false;}
      const L0=stats().level;
      if(isNew)S.tx.push({id:uid(),date:v.date,amount:a,type:type,cat:type==='out'?(v.cat||''):'',note:(v.note||'').trim(),at:Date.now()});
      else{tx.date=v.date;tx.amount=a;tx.note=(v.note||'').trim();if(type==='out')tx.cat=v.cat||'';}
      ui.bMonth=v.date.slice(0,7);commit();if(isNew)xpToast(L0,'+2 XP');
    },
    onDelete:isNew?null:()=>{S.tx=S.tx.filter(x=>x.id!==tx.id);commit();}});
}

/* sinhronizacija */
const FB_ERRS={
  'auth/unauthorized-domain':'Ovaj sajt nije dodat u Authorized domains u Firebase-u.',
  'auth/invalid-api-key':'Firebase ključ nije ispravan. Proveri firebase-config.js.',
  'auth/api-key-not-valid.-please-pass-a-valid-api-key.':'Firebase ključ nije ispravan. Proveri firebase-config.js.',
  'auth/operation-not-allowed':'Google prijava nije uključena u Firebase-u.',
  'auth/network-request-failed':'Nema interneta.'
};
A.syncIn=()=>{
  if(!FB.adapter){toast('Sinhronizacija se još učitava. Probaj za par sekundi.');return;}
  const pr=FB.adapter.signIn();
  closeSheet();
  Promise.resolve(pr).catch(e=>{
    const c=e&&e.code;
    if(c==='auth/popup-closed-by-user'||c==='auth/cancelled-popup-request')return;
    FB.err=e;toast(FB_ERRS[c]||('Prijava nije uspela'+(c?': '+c:'')));
  });
};
A.syncOut=()=>{
  closeSheet();
  Promise.resolve(FB.adapter&&FB.adapter.signOut()).then(()=>toast('Odjavljen. Podaci ostaju na ovom uređaju.'));
};
A.syncNow=()=>{closeSheet();if(!FB.user)return;if(!navigator.onLine){toast('Nema interneta');return;}toast('Sinhronizujem…');FB.latest=null;fbFlush();};

A.exportData=async()=>{
  const json=JSON.stringify({app:'moj-zivot',v:1,exported:new Date().toISOString(),data:S},null,2);
  try{
    const c=window.claude;const dl=c&&c.use?await c.use('downloads'):null;
    if(!dl)throw new Error('no');
    await dl.save({filename:'moj-zivot-'+TODAY()+'.json',data:json});toast('Kopija je spremna');
  }catch(e){
    if(e&&e.code==='cancelled'){return;}
    try{const b=new Blob([json],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='moj-zivot-'+TODAY()+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);}catch(x){}
    closeSheet();
    openSheet({title:'Kopija podataka',color:'pink',focus:false,html:'<p class="muted">Kopija bi trebalo da je preuzeta kao fajl (proveri Preuzimanja). Ako nije, kopiraj ceo tekst ispod i čuvaj ga negde. Kasnije ga možeš uvesti nazad.</p><textarea rows="10" readonly onclick="this.select()">'+esc(json)+'</textarea>'});
  }
};
A.importSheet=()=>{
  closeSheet();

    html:'<label class="fl"><span>Ili izaberi fajl kopije</span><input type="file" id="impf" data-ch="impf" accept=".json,application/json"></label>',

  const first=t.slice(0,8)+'01',pm=addDays(first,-10),pm2=addDays(first,-40);

  tx(first,'in',25000,'Stipendija');tx(first,'in',8000,'Od kuće');tx(first,'save',5000,'');
  [[0,850,'Pekara i market',0],[1,1200,'Kafa i izlazak',3],[2,500,'Gradski prevoz',1],[3,1400,'Namirnice',0],[4,900,'Skripta',4],[5,650,'Apoteka',5],[6,1750,'Namirnice',0],[7,2200,'Večera sa društvom',3]].forEach(r=>{const d=addDays(t,-r[0]);tx(d<first?first:d,'out',r[1],r[2],r[3]);});
  tx(first,'out',6500,'Dom: račun',2);
  tx(pm,'in',33000,'Prihod');tx(pm,'out',7800,'Hrana',0);tx(pm,'out',3200,'Izlasci',3);tx(pm,'out',6500,'Dom: račun',2);tx(pm,'save',5000,'');
  tx(pm2,'in',31000,'Prihod');tx(pm2,'out',9400,'Hrana',0);tx(pm2,'out',2600,'Prevoz',1);tx(pm2,'out',6500,'Dom: račun',2);
  S=norm(s);
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');
  if(el&&A[el.dataset.a]){e.preventDefault();A[el.dataset.a](el,e);}
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const el=e.target;
  if(el&&el.dataset&&el.dataset.enter&&A[el.dataset.enter]){e.preventDefault();A[el.dataset.enter](el,e);}
});
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='jt'||id==='jg'){
    const j=jEntry(ui.jDate);
    if(id==='jt')j.text=e.target.value;else j.good=e.target.value;
    queueSave();
  }
});
const CH={
  timerSubj:el=>{T.sid=el.value;},
  impf:el=>{const f=el.files&&el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const ta=$('#sheet [name=json]');if(ta)ta.value=String(r.result);};r.readAsText(f);},
  exSel:el=>{ui.exSel=el.value;render();}
};
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.set){syncDraft();queueSave();return;}
  if(el.dataset&&el.dataset.ch&&CH[el.dataset.ch])CH[el.dataset.ch](el);
});

/* ---------- boot ---------- */
(function boot(){
  const cached=lsLoad();
  if(cached)S=norm(cached);
  applyTheme();
  render();
  if(FB.on){fbBoot();return;}
  const getClaude=()=>new Promise(res=>{let n=0;const iv=setInterval(()=>{if(window.claude&&window.claude.use){clearInterval(iv);res(window.claude);}else if(++n>40){clearInterval(iv);res(null);}},100);});
  (async()=>{
    const c=await getClaude();
    if(!c){saveState='local';renderStatus();return;}
    let d=null,id=null;
    try{const u=await c.use('user');id=u?await u.id():null;d=await c.use('db');}catch(e){}
    if(!d||!id){saveState='local';renderStatus();return;}
    db=d;uidStr=id;
    try{
      const snap=await db.collection('data/users/'+id).get();
      const map={};
      snap.docs.forEach(x=>{if(x.exists){const dt=x.data();map[x.id]=dt;known.add(x.id);lastWritten[x.id]=JSON.stringify(dt);}});
      const empty=!Object.keys(map).length;
      if(empty){if(hasContent()){flush();}else saveState='saved';}
      else if(dirty){flush();}
      else{S=fromDocs(map);lsSave();saveState='saved';applyTheme();render();}
    }catch(e){saveState='error';console.error(e);}
    renderStatus();
  })();
})();
})();
</script>

if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
}
</script>
